name: Webhook Test (temporary)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -f -X POST -H "Content-Type: application/json" \
            -d '{"content": "JobNotifier webhook test -- if you see this, notifications are wired up correctly. Safe to ignore."}' \
            "$DISCORD_WEBHOOK_URL"
