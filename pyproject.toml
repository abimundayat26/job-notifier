[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobnotifier"
version = "0.1.0"
description = "Personal job-posting monitor with Discord notifications"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock"]
tier3 = ["beautifulsoup4", "playwright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "live: hits real external sources, excluded from normal CI runs",
]
testpaths = ["tests"]
