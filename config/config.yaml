sources:
  # "Off-season" (Fall/Winter/Spring) internships are NOT a separate repo --
  # SimplifyJobs' README-Off-Season.md is just a filtered view of this same
  # listings.json (confirmed 2026-09-01: every term from Summer 2025 through
  # Summer 2029 appears in one file, distinguished by each entry's "terms"
  # field). One row covers both "2027 internships" and "2027 off-season
  # internships" the user asked for.
  tier1_aggregators:
    - repo: "SimplifyJobs/Summer2027-Internships"
      ref: "dev"
      path: ".github/scripts/listings.json"
  # `company` here must normalize identically to how Tier 1 spells the same
  # employer after normalize.normalize_company() (lowercase + whitespace
  # collapse only -- no alias table, unlike normalize_location). A mismatch
  # doesn't error; it just creates two separate state entries for the same
  # real job, so you get a duplicate notification instead of a merged one.
  # This is the accepted failure mode (SPEC.md §9: ambiguous matches never
  # silently collapse) but it's worth getting right when adding a row.
  tier2_ats:
    # Palantir has a live public Lever board (confirmed 2026-08-30 via
    # api.lever.co/v0/postings/palantir) -- no Tier 3 scraper needed despite
    # SPEC.md §4 listing it as a Tier 3 target.
    - platform: lever
      company: "Palantir"
      slug: "palantir"
  tier3_scrapers:
    - company: "citadel"
      fetch_method: http
      sort_order: relevance   # no date field exists to sort by; pagination is mandatory (SPEC.md §11)
  tier4_manual:
    # Citadel Securities: /careers/open-opportunities/ (and even /robots.txt)
    # returns a genuine interactive Cloudflare JS challenge -- plain HTTP
    # scraping doesn't work, and Playwright isn't guaranteed to pass it from
    # a GitHub Actions IP. Confirmed 2026-08-30.
    - "Citadel Securities"
    # D. E. Shaw: careers page doesn't server-render listings, and its own JS
    # bundle references /recruit/, which robots.txt explicitly disallows --
    # the real job data likely sits behind a path our own politeness policy
    # (SPEC.md §11) forbids fetching. Confirmed 2026-08-30.
    - "D. E. Shaw"

filters:
  # Matching is a plain case-insensitive substring check (filters.py's
  # _title_contains_any), not word-boundary/regex -- "software engineer"
  # already covers "Software Engineering [Intern/Manager/...]" for free.
  # swe/sde are kept short deliberately (real abbreviations, not written out
  # elsewhere in this list) at a small, accepted false-positive-substring risk.
  title_include:
    - "software engineer"
    - "software developer"
    - "software development" # catches "Software Development Engineer" (SDE) titles "software developer" itself doesn't match
    - "swe"
    - "sde"
    - "backend engineer"
    - "backend developer"
    - "frontend engineer"
    - "frontend developer"
    - "full stack engineer"
    - "full-stack engineer"
    - "fullstack engineer"
    - "full stack developer"
    - "quant developer"
    - "quantitative developer"
    - "quant researcher"
    - "quantitative researcher"
  title_exclude: ["senior", "staff", "principal"]
  locations: [] # no location constraint -- any location/remote status passes
  remote_only: false
  seniority_exclude: ["senior", "staff", "principal"]

notification:
  discord_webhook_url: "${DISCORD_WEBHOOK_URL}"
  per_run_cap: 20

state:
  path: "state/seen_jobs.json"
  retention_days: 30
  seed_window_days: 30
  commit: true

failure:
  abort_threshold_pct: 50
